name: frontend
description: "MakharijPro AI - Real-Time Tajweed Error Detection System for Quran Recitation. Flutter UI prototype."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  go_router: ^14.6.2
  flutter_bloc: ^8.1.6
  equatable: ^2.0.5
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.14
  lottie: ^3.1.3
  fl_chart: ^0.69.2
  shimmer: ^3.0.0
  cached_network_image: ^3.4.1
  intl: ^0.19.0
  firebase_core: ^4.11.0
  firebase_auth: ^6.5.4
  cloud_firestore: ^6.6.0
  google_sign_in: ^7.2.0
  google_sign_in_web: ^1.1.3
  record: ^5.2.0
  http: ^1.2.2
  path_provider: ^2.1.4
  audioplayers: ^6.1.0
  web_socket_channel: ^3.0.3
  shared_preferences: ^2.3.3

# Upstream semver break, not a choice about this app.
#
# `record: ^5.2.0` pins record_linux to >=0.5.0 <1.0.0, so pub resolves 0.7.2.
# But record_android 1.5.2 requires record_platform_interface ^1.5.0, and pub
# takes the newest match -- 1.6.0 -- which added `startStream` and gave
# `hasPermission` a named argument. Those are breaking changes shipped in a
# minor version, and record_linux 0.7.2 never implemented them, so the Dart
# kernel compile fails on an *Android* build with:
#   'RecordLinux' is missing implementations for RecordMethodChannelPlatformInterface.startStream
#
# This app targets Android (plus web/Windows for development) and never builds
# for Linux -- record_linux is only in the graph because `record` declares it
# unconditionally. 1.3.1 is the newest 1.x and tracks record_platform_interface
# ^1.5.0, so it satisfies the compiler without touching the Android and web
# implementations the recitation flow actually uses.
#
# Remove this once the app moves to `record: ^7`, where the whole family is
# aligned on record_platform_interface ^2.1.0. That is a two-major-version jump
# and needs the startStream call in recitation_cubit.dart re-checked first.
dependency_overrides:
  record_linux: ^1.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/images/photos/
    - assets/icons/google_logo.svg
    - assets/quran/

  # Bundled, not fetched at runtime: the Quran must render in its own face on
  # a first launch with no connection. All three families are SIL OFL 1.1;
  # the licence texts sit beside the files in assets/fonts/.
  fonts:
    - family: Figtree
      fonts:
        - asset: assets/fonts/Figtree-Regular.ttf
          weight: 400
        - asset: assets/fonts/Figtree-Medium.ttf
          weight: 500
        - asset: assets/fonts/Figtree-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Figtree-Bold.ttf
          weight: 700
    - family: Amiri
      fonts:
        - asset: assets/fonts/Amiri-Regular.ttf
          weight: 400
        - asset: assets/fonts/Amiri-Bold.ttf
          weight: 700
    - family: AmiriQuran
      fonts:
        - asset: assets/fonts/AmiriQuran-Regular.ttf

flutter_launcher_icons:
  android: true
  image_path: "assets/icons/app_icon.png"
  adaptive_icon_background: "#1F6E4E"
  adaptive_icon_foreground: "assets/icons/app_icon_foreground.png"
